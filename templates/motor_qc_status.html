<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สถานะสินค้า | SAS QC Motor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#eff6ff,#ffffff);font-family:'Segoe UI',sans-serif;padding:22px;}
    .top-actions{position:fixed;top:16px;right:20px;display:flex;gap:10px;z-index:50;flex-wrap:wrap;justify-content:flex-end;}
    .top-actions a{background:linear-gradient(180deg,#5aa7ff 0%,#2f79d8 100%);color:#fff!important;border:none;border-radius:10px;padding:8px 18px;font-size:1.05rem;font-weight:800;box-shadow:0 4px 12px rgba(0,70,160,.25);text-decoration:none;white-space:nowrap;}
    .top-actions a.gen{background:linear-gradient(180deg,#34d270 0%,#169c4a 100%);}
    .top-actions a.status{background:linear-gradient(180deg,#f59e0b 0%,#b45309 100%);}
    .shell{max-width:1200px;margin:70px auto 20px;}
    .hero{background:linear-gradient(135deg,#0b63ce,#1e3a8a);color:#fff;padding:26px 30px;border-radius:22px 22px 0 0;box-shadow:0 24px 60px rgba(15,23,42,.16);}
    .hero h1{font-size:2rem;font-weight:900;margin:0;}
    .hero .sub{opacity:.9;margin-top:6px;font-size:1.05rem;}
    .card-body-shell{background:#fff;border-radius:0 0 22px 22px;box-shadow:0 24px 60px rgba(15,23,42,.10);padding:22px 26px 28px;}
    .legend{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 20px;}
    .filter-btn{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.02rem;background:#fff;border:2px solid #e2e8f0;border-radius:999px;padding:9px 18px;color:#334155;cursor:pointer;transition:all .15s;}
    .filter-btn:hover{border-color:#93c5fd;background:#f8fbff;}
    .filter-btn.active{border-color:#0b63ce;background:#0b63ce;color:#fff;box-shadow:0 6px 16px rgba(11,99,206,.28);}
    .filter-btn.active .dot{box-shadow:0 0 0 3px rgba(255,255,255,.55);}
    .dot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none;}
    .dot.green{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18);}
    .dot.yellow{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.18);}
    .dot.red{background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.18);animation:pulse 1.1s infinite;}
    .dot.gray{background:#94a3b8;}
    .dot.blue{background:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.18);}
    .dot.all{background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);}
    @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.35);}100%{transform:scale(1);}}
    #searchBox{max-width:340px;font-size:1.1rem;padding:10px 14px;border-radius:12px;}
    table.qc-table{width:100%;border-collapse:separate;border-spacing:0 10px;}
    table.qc-table thead th{font-size:1.02rem;color:#0b63ce;font-weight:900;padding:6px 10px;border-bottom:2px solid #dbeafe;}
    table.qc-table tbody tr{background:#f8fbff;box-shadow:0 2px 10px rgba(15,23,42,.05);}
    table.qc-table tbody tr.overdue-row{background:#fff1f2;}
    table.qc-table td{padding:16px 10px;vertical-align:middle;font-size:1.08rem;font-weight:650;color:#1e293b;}
    .or-no{font-weight:900;font-size:1.25rem;color:#0b63ce;}
    .company{font-size:1.05rem;color:#334155;}
    .stage-label{font-weight:900;font-size:1.12rem;}
    .owner-badge{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:900;background:#eaf4ff;color:#0b63ce;border:1px solid #bfdbfe;font-size:.98rem;}
    .elapsed-big{font-size:1.55rem;font-weight:900;}
    .elapsed-big.green{color:#15803d;}
    .elapsed-big.yellow{color:#b45309;}
    .elapsed-big.red{color:#b91c1c;}
    .elapsed-big.gray{color:#64748b;}
    .elapsed-big.blue{color:#1d4ed8;}
    .btn-related{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:800;font-size:.95rem;white-space:nowrap;margin-left:6px;}
    .btn-proof{background:#0891b2;color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;text-decoration:none;font-size:.95rem;white-space:nowrap;display:inline-block;margin-top:6px;}
    .hold-note{margin-top:6px;font-size:.85rem;color:#1d4ed8;font-weight:800;}
    .since-line{font-size:.85rem;color:#64748b;font-weight:600;}
    .btn-pdf{background:#0b63ce;color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;text-decoration:none;font-size:.95rem;white-space:nowrap;}
    .btn-deliver{background:#16a34a;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:800;font-size:.95rem;white-space:nowrap;}
    .btn-note-q{width:30px;height:30px;border-radius:50%;border:2px solid #f59e0b;background:#fff7e6;color:#b45309;font-weight:900;font-size:1rem;line-height:1;cursor:pointer;margin-left:6px;}
    .btn-note-q:hover{background:#fde8c8;}
    .btn-note-q.has-note{background:#f59e0b;color:#fff;}
    .note-flag{margin-top:6px;font-size:.85rem;color:#b45309;font-weight:800;}
    .owner-cell{display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
    .empty-state{text-align:center;padding:50px 10px;font-size:1.2rem;color:#64748b;font-weight:700;}
    .updated-note{text-align:right;color:#64748b;font-weight:700;font-size:.95rem;margin-top:10px;}
    @media(max-width:900px){table.qc-table thead{display:none;} table.qc-table tbody tr{display:block;border-radius:16px;padding:10px;} table.qc-table td{display:flex;justify-content:space-between;border-bottom:1px dashed #dbeafe;} table.qc-table td:last-child{border-bottom:0;}}
  </style>
</head>
<body>
  <div class="top-actions">
    <a href="/login">🔐 QC Login</a>
    <a href="/admin-motor-qc" class="gen">📄 ออกเอกสารQC-Motor</a>
    <a href="/motor-qc-status" class="status">📊 สถานะสินค้า</a>
    <a href="/">🏠 Home</a>
  </div>

  <div class="shell">
    <div class="hero">
      <h1>📊 สถานะสินค้า QC-Motor</h1>
      <div class="sub">ติดตามสถานะทุก OR No. แบบ Real-time — งานค้างเกิน 24 ชม. จะระบบส่งอีเมลแจ้งเตือนแผนกที่รับผิดชอบอัตโนมัติ</div>
    </div>
    <div class="card-body-shell">
      <div class="legend" id="filterBar">
        <button type="button" class="filter-btn active" data-filter="active"><span class="dot all"></span> ทั้งหมดที่กำลังทำงาน</button>
        <button type="button" class="filter-btn" data-filter="green"><span class="dot green"></span> ปกติ (&lt; 12 ชม.)</button>
        <button type="button" class="filter-btn" data-filter="yellow"><span class="dot yellow"></span> ใกล้ครบกำหนด (12-24 ชม.)</button>
        <button type="button" class="filter-btn" data-filter="red"><span class="dot red"></span> ค้างเกิน 24 ชม.</button>
        <button type="button" class="filter-btn" data-filter="blue"><span class="dot blue"></span> ระงับ / รอเพิ่มเติม</button>
        <button type="button" class="filter-btn" data-filter="gray"><span class="dot gray"></span> จัดส่งเรียบร้อย</button>
      </div>
      <input type="text" id="searchBox" class="form-control" placeholder="🔎 ค้นหา OR No. หรือ บริษัท...">
      <div id="tableWrap" class="mt-3">
        <div class="empty-state">⏳ กำลังโหลดข้อมูล...</div>
      </div>
      <div class="updated-note" id="updatedNote"></div>
    </div>
  </div>

  <div class="modal fade" id="noteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius:18px;overflow:hidden;">
        <div class="modal-header" style="background:#0b63ce;color:#fff;">
          <h5 class="modal-title fw-bold">📝 แจ้งปัญหา / หมายเหตุ</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="fw-bold text-primary mb-3" id="noteModalJobLabel"></div>
          <div class="mb-3">
            <label class="form-label fw-bold">ชื่อผู้แจ้ง</label>
            <input type="text" id="noteReporter" class="form-control" placeholder="ชื่อของคุณ">
          </div>
          <div class="mb-2">
            <label class="form-label fw-bold">หมายเหตุ / สาเหตุที่ทำงานต่อไม่ได้</label>
            <textarea id="noteText" class="form-control" rows="4" placeholder="เช่น สินค้าชำรุดตอน QC, รอชิ้นส่วนเพิ่ม, รอเอกสารเพิ่มเติม..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
          <button class="btn btn-danger fw-bold" id="noteSaveBtn">📩 บันทึกและแจ้งเตือนขั้นตอนถัดไป</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="resolveModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius:18px;overflow:hidden;">
        <div class="modal-header" style="background:#7c3aed;color:#fff;">
          <h5 class="modal-title fw-bold">🧑‍🤝‍🧑 ผู้เกี่ยวข้อง — งานค้างเกิน 24 ชม.</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="fw-bold text-primary mb-3" id="resolveModalJobLabel"></div>
          <div class="mb-3">
            <label class="form-label fw-bold">ชื่อผู้ดำเนินการ</label>
            <input type="text" id="resolveReporter" class="form-control" placeholder="ชื่อของคุณ">
          </div>
          <div class="btn-group w-100 mb-3" role="group">
            <input type="radio" class="btn-check" name="resolveAction" id="actShipped" value="shipped" checked>
            <label class="btn btn-outline-success fw-bold" for="actShipped">✅ ส่งสินค้าแล้ว</label>
            <input type="radio" class="btn-check" name="resolveAction" id="actHold" value="hold">
            <label class="btn btn-outline-danger fw-bold" for="actHold">⛔ แจ้งเหตุผลที่ยังส่งไม่ได้</label>
          </div>

          <div id="shippedSection">
            <div class="mb-3">
              <label class="form-label fw-bold">แนบไฟล์ยืนยันการส่งสินค้า (รูป/PDF) — กรณีส่งไปแล้วแต่ไม่ได้ทำผ่านระบบ</label>
              <input type="file" id="proofFile" class="form-control" accept=".pdf,image/*">
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold">หมายเหตุ (ถ้ามี)</label>
              <textarea id="shippedNote" class="form-control" rows="2" placeholder="เช่น ส่งผ่านขนส่งเอกชนวันที่..."></textarea>
            </div>
          </div>

          <div id="holdSection" style="display:none;">
            <div class="mb-3">
              <label class="form-label fw-bold">เหตุผลที่ยังส่งสินค้ารายการนี้ไม่ได้</label>
              <select id="holdReason" class="form-select">
                <option value="รอลูกค้าโอนเงิน">รอลูกค้าโอนเงิน</option>
                <option value="ลูกค้ายกเลิกคำสั่งซื้อ">ลูกค้ายกเลิกคำสั่งซื้อ</option>
                <option value="อื่นๆ">อื่นๆ (ระบุรายละเอียดด้านล่าง)</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold">รายละเอียดเพิ่มเติม</label>
              <textarea id="holdNote" class="form-control" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
          <button class="btn btn-primary fw-bold" id="resolveSaveBtn">💾 บันทึก</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allJobs = [];
let currentFilter = 'active'; // active = ทุกงานที่ยังไม่จัดส่ง (ไม่รวม gray/delivered)

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderTable();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

function renderTable(){
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const wrap = document.getElementById('tableWrap');
  let jobs = allJobs;

  if(currentFilter === 'active'){
    jobs = jobs.filter(j => j.color !== 'gray' && j.color !== 'blue');
  } else {
    jobs = jobs.filter(j => j.color === currentFilter);
  }

  if(q){
    jobs = jobs.filter(j => (j.qr_no||'').toLowerCase().includes(q) || (j.company_name||'').toLowerCase().includes(q));
  }
  if(!jobs.length){
    wrap.innerHTML = '<div class="empty-state">ไม่พบข้อมูลงานในหมวดนี้</div>';
    return;
  }
  let html = '<table class="qc-table"><thead><tr>' +
    '<th>ไฟสถานะ</th><th>OR No. / บริษัท</th><th>ขั้นตอนปัจจุบัน</th><th>ผู้รับผิดชอบ</th>' +
    '<th>รอมาแล้ว</th><th>จำนวนรายการ</th><th>เอกสาร</th>' +
    '</tr></thead><tbody>';

  jobs.forEach(j => {
    const rowClass = j.overdue ? 'overdue-row' : '';
    const jobLabel = `${j.qr_no} - ${j.company_name}`.replace(/'/g, "\\'");
    html += `<tr class="${rowClass}">`;
    html += `<td data-label=""><span class="dot ${j.color}"></span></td>`;
    html += `<td data-label="OR No."><div class="or-no">${esc(j.qr_no)}</div><div class="company">${esc(j.company_name)}</div></td>`;
    html += `<td data-label="ขั้นตอน"><span class="stage-label">${esc(j.waiting_label)}</span>` +
            (j.color === 'blue' && j.extra_note ? `<div class="hold-note">📌 ${esc(j.extra_note)}</div>` : '') +
            `</td>`;
    html += `<td data-label="ผู้รับผิดชอบ"><div class="owner-cell"><span class="owner-badge">${esc(j.owner_label)}</span>` +
            `<button class="btn-note-q ${j.has_note ? 'has-note' : ''}" title="แจ้งปัญหา/หมายเหตุ" onclick="openNoteModal('${esc(j.job_key)}','${esc(jobLabel)}')">?</button></div>` +
            (j.has_note && j.latest_note ? `<div class="note-flag">⚠️ ${esc(j.latest_note.note)}</div>` : '') +
            `</td>`;
    html += `<td data-label="รอมาแล้ว"><div class="elapsed-big ${j.color}">${esc(j.elapsed_label)}</div><div class="since-line">ตั้งแต่ ${esc(j.since)}</div></td>`;
    html += `<td data-label="จำนวนรายการ">${esc(j.item_count)} รายการ</td>`;
    let docCell = '';
    if(j.pdf_url){ docCell += `<a class="btn-pdf" href="${esc(j.pdf_url)}" target="_blank">📄 PDF</a> `; }
    if(j.status === 'packed_ready_to_ship'){
      docCell += `<button class="btn-deliver mt-1" onclick="markDelivered('${esc(j.job_key)}')">✅ จัดส่งแล้ว</button>`;
    }
    if(j.color === 'red'){
      docCell += `<button class="btn-related" onclick="openResolveModal('${esc(j.job_key)}','${esc(jobLabel)}')">🧑‍🤝‍🧑 ผู้เกี่ยวข้อง</button>`;
    }
    if(j.status === 'closed_manual_shipped' && j.proof_url){
      docCell += `<br><a class="btn-proof" href="${esc(j.proof_url)}" target="_blank">📎 ไฟล์ที่ส่งแล้ว</a>`;
    }
    html += `<td data-label="เอกสาร">${docCell}</td>`;
    html += `</tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

let noteJobKey = null;
function openNoteModal(jobKey, label){
  noteJobKey = jobKey;
  document.getElementById('noteModalJobLabel').textContent = label;
  document.getElementById('noteReporter').value = '';
  document.getElementById('noteText').value = '';
  const modal = new bootstrap.Modal(document.getElementById('noteModal'));
  modal.show();
}

document.getElementById('noteSaveBtn').addEventListener('click', async () => {
  const note = document.getElementById('noteText').value.trim();
  if(!note){ alert('กรุณากรอกหมายเหตุก่อนบันทึก'); return; }
  const reporter = document.getElementById('noteReporter').value.trim();
  const btn = document.getElementById('noteSaveBtn');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
  try{
    const res = await fetch(`/api/motor-qc/note/${encodeURIComponent(noteJobKey)}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({note, reported_by: reporter})
    });
    const data = await res.json();
    if(data.ok){
      bootstrap.Modal.getInstance(document.getElementById('noteModal')).hide();
      fetchStatus();
    } else {
      alert('เกิดข้อผิดพลาด: ' + (data.error || ''));
    }
  }catch(e){
    alert('เกิดข้อผิดพลาด: ' + e);
  }finally{
    btn.disabled = false; btn.textContent = '📩 บันทึกและแจ้งเตือนขั้นตอนถัดไป';
  }
});

async function markDelivered(jobKey){
  if(!confirm('ยืนยันว่าขนส่งรับของและนำส่งลูกค้าเรียบร้อยแล้ว?')) return;
  try{
    const res = await fetch(`/motor-qc-status/mark-delivered/${encodeURIComponent(jobKey)}`, {method:'POST'});
    const data = await res.json();
    if(data.ok){ fetchStatus(); } else { alert('เกิดข้อผิดพลาด: ' + (data.error||'')); }
  }catch(e){ alert('เกิดข้อผิดพลาด: ' + e); }
}

let resolveJobKey = null;
function toggleResolveSections(){
  const shipped = document.getElementById('actShipped').checked;
  document.getElementById('shippedSection').style.display = shipped ? '' : 'none';
  document.getElementById('holdSection').style.display = shipped ? 'none' : '';
}
document.querySelectorAll('input[name="resolveAction"]').forEach(r => r.addEventListener('change', toggleResolveSections));

function openResolveModal(jobKey, label){
  resolveJobKey = jobKey;
  document.getElementById('resolveModalJobLabel').textContent = label;
  document.getElementById('resolveReporter').value = '';
  document.getElementById('proofFile').value = '';
  document.getElementById('shippedNote').value = '';
  document.getElementById('holdNote').value = '';
  document.getElementById('holdReason').selectedIndex = 0;
  document.getElementById('actShipped').checked = true;
  toggleResolveSections();
  const modal = new bootstrap.Modal(document.getElementById('resolveModal'));
  modal.show();
}

document.getElementById('resolveSaveBtn').addEventListener('click', async () => {
  const action = document.querySelector('input[name="resolveAction"]:checked').value;
  const reporter = document.getElementById('resolveReporter').value.trim();
  const fd = new FormData();
  fd.append('action', action);
  fd.append('reported_by', reporter);
  if(action === 'shipped'){
    const file = document.getElementById('proofFile').files[0];
    if(file) fd.append('proof_file', file);
    fd.append('note', document.getElementById('shippedNote').value.trim());
  } else {
    fd.append('reason', document.getElementById('holdReason').value);
    fd.append('note', document.getElementById('holdNote').value.trim());
  }
  const btn = document.getElementById('resolveSaveBtn');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
  try{
    const res = await fetch(`/api/motor-qc/resolve/${encodeURIComponent(resolveJobKey)}`, {method: 'POST', body: fd});
    const data = await res.json();
    if(data.ok){
      bootstrap.Modal.getInstance(document.getElementById('resolveModal')).hide();
      fetchStatus();
    } else {
      alert('เกิดข้อผิดพลาด: ' + (data.error || ''));
    }
  }catch(e){
    alert('เกิดข้อผิดพลาด: ' + e);
  }finally{
    btn.disabled = false; btn.textContent = '💾 บันทึก';
  }
});

async function fetchStatus(){
  try{
    const res = await fetch('/api/motor-qc/status');
    const data = await res.json();
    if(data.ok){
      allJobs = data.jobs || [];
      renderTable();
      document.getElementById('updatedNote').textContent = 'อัปเดตล่าสุด: ' + data.now + ' (รีเฟรชอัตโนมัติทุก 8 วินาที)';
    }
  }catch(e){
    console.error(e);
  }
}

document.getElementById('searchBox').addEventListener('input', renderTable);
fetchStatus();
setInterval(fetchStatus, 8000);
</script>
</body>
</html>
